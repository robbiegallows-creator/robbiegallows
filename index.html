<!-- Artist Structured Data -->

<script type="application/ld+json">
{
 "@context":"https://schema.org",
 "@type":"VisualArtist",
 "name":"Robbie Gallows",
 "url":"https://robbiegallows.netlify.app/",
 "description":"Contemporary gothic expressionist artist creating paintings and multimedia works exploring mortality, mythology, spirituality, memory, and the human condition."
}
</script>


<style>

:root{

--black:#050505;
--dark:#0d0d11;
--panel:#15151b;
--gold:#c5a059;
--gold-light:#e4c47a;
--white:#f3efe7;
--gray:#a8a5a0;

}


*{

box-sizing:border-box;
scroll-behavior:smooth;

}


body{

margin:0;

background:
radial-gradient(circle at 50% 0%, #242430 0%, #09090b 45%, #050505 100%);

color:var(--white);

font-family:'Plus Jakarta Sans',sans-serif;

line-height:1.8;

overflow-x:hidden;

}



body:before{

content:"";

position:fixed;

inset:0;

background-image:
linear-gradient(
rgba(255,255,255,.02) 1px,
transparent 1px
);

background-size:100% 4px;

pointer-events:none;

opacity:.15;

}



h1,h2,h3{

font-family:'Cinzel',serif;

letter-spacing:3px;

font-weight:600;

}



a{

color:var(--gold);

text-decoration:none;

}



header{

position:sticky;

top:0;

z-index:100;

background:rgba(5,5,5,.85);

backdrop-filter:blur(12px);

border-bottom:1px solid rgba(197,160,89,.25);

padding:20px;

}



.nav{

max-width:1250px;

margin:auto;

display:flex;

justify-content:space-between;

align-items:center;

flex-wrap:wrap;

}



.logo{

font-size:30px;

letter-spacing:3px;

}



.menu a{

margin:0 12px;

font-size:14px;

text-transform:uppercase;

letter-spacing:2px;

}



.menu a:hover{

color:var(--gold-light);

}



.hero{

min-height:90vh;

display:flex;

align-items:center;

justify-content:center;

text-align:center;

padding:40px 20px;

position:relative;

}



.hero-content{

max-width:900px;

}



.hero h1{

font-size:clamp(48px,8vw,100px);

margin:0;

text-transform:uppercase;

}



.hero p{

font-size:21px;

max-width:750px;

margin:30px auto;

color:#d4d0c8;

}



.button{

display:inline-block;

padding:16px 45px;

border:1px solid var(--gold);

text-transform:uppercase;

letter-spacing:3px;

transition:.4s;

}



.button:hover{

background:var(--gold);

color:#000;

}



section{

max-width:1200px;

margin:auto;

padding:90px 25px;

}



.section-title{

text-align:center;

margin-bottom:50px;

font-size:38px;

}



.gallery{

display:grid;

grid-template-columns:repeat(auto-fit,minmax(280px,1fr));

gap:35px;

}



.card{

background:linear-gradient(145deg,#16161c,#0c0c0f);

border:1px solid rgba(197,160,89,.2);

padding:20px;

transition:.5s;

}



.card:hover{

transform:translateY(-10px);

border-color:var(--gold);

box-shadow:0 20px 50px rgba(0,0,0,.6);

}



.card img{

width:100%;

height:380px;

object-fit:cover;

cursor:pointer;

}



.card h3{

color:var(--gold);

font-size:22px;

}



footer{

padding:50px 20px;

text-align:center;

border-top:1px solid rgba(197,160,89,.2);

color:#888;

}



@media(max-width:700px){

.logo{

width:100%;

text-align:center;

margin-bottom:15px;

}


.menu{

width:100%;

text-align:center;

}


.hero p{

font-size:17px;

}


.section-title{

font-size:30px;

}

}

</style>

</head>
