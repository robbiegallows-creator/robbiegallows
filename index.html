<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Robbie Gallows | Gothic Expressionist Fine Art</title>
  <meta name="description" content="Robbie Gallows creates contemporary gothic expressionist fine art exploring mortality, mythology, spirituality, memory, consciousness, and the human condition through painting and multimedia works.">
  <link href="https://fonts.googleapis.com/css2?family=Cinzel+Decorative:wght@700&family=Cinzel:wght@400;600;700&family=Cormorant+Garamond:ital,wght@0,300;0,400;0,600;1,400&family=Plus+Jakarta+Sans:wght@300;400;500&display=swap" rel="stylesheet">
  <style>
    /* Base Styles remain the same, ensuring all structure is kept */
    :root { --void: #020203; --gold: #c5a059; --white: #e8e4dc; --muted: #99958d; --panel: #0d0d12; }
    body { background-color: var(--void); color: var(--white); font-family: 'Plus Jakarta Sans', sans-serif; margin: 0; }
    .container { max-width: 1280px; margin: 0 auto; padding: 0 30px; }
    .section { padding: 100px 0; border-bottom: 1px solid #1c1c24; }
    .gallery-grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(320px, 1fr)); gap: 40px; }
    .art-card { background: var(--panel); border: 1px solid rgba(197, 160, 89, 0.2); cursor: pointer; }
    .art-thumb-wrapper { width: 100%; height: 400px; overflow: hidden; }
    .art-thumb-wrapper img { width: 100%; height: 100%; object-fit: cover; }
    .art-info { padding: 20px; }
    .video-wrapper { max-width: 900px; margin: 0 auto; }
    .video-box { position: relative; padding-bottom: 56.25%; height: 0; }
    .video-box iframe { position: absolute; width: 100%; height: 100%; }
    .lightbox { display: none; position: fixed; inset: 0; background: rgba(0,0,0,0.9); z-index: 1000; justify-content: center; align-items: center; }
    .lightbox.active { display: flex; }
  </style>
</head>
<body>

<header>
  <div class="container nav" style="display:flex; justify-content:space-between; align-items:center; height:90px;">
    <div class="logo" style="font-family:'Cinzel'; font-size:1.6rem; letter-spacing:4px;">ROBBIE <span>GALLOWS</span></div>
    <nav style="display:flex; gap:20px;">
      <a href="#gallery" style="color:var(--gold);">Works</a>
      <a href="#multimedia" style="color:var(--gold);">Media</a>
      <a href="#contact" style="color:var(--gold);">Contact</a>
    </nav>
  </div>
</header>

<section id="gallery" class="section">
  <div class="container">
    <h2 style="text-align:center; margin-bottom:50px;">THE LITANY OF LOST HOURS</h2>
    <div class="gallery-grid">
      <!-- ARTWORK CARDS -->
      <div class="art-card" onclick="openLightbox('img1.jpg', 'img1-detail.jpg', 'Mushroom', 'A multimedia exploration from 2025.', 'Digital')">
        <div class="art-thumb-wrapper"><img src="mushroom.jpg" alt="Mushroom"></div>
        <div class="art-info"><h3>Mushroom</h3><p>2025 Multimedia Artwork</p></div>
      </div>
      <div class="art-card" onclick="openLightbox('img2.jpg', 'img2-detail.jpg', 'Environment', 'Oil and digital integration.', 'Hybrid')">
        <div class="art-thumb-wrapper"><img src="environment.jpg" alt="Environment"></div>
        <div class="art-info"><h3>Environment</h3><p>2025 Oil & Digital</p></div>
      </div>
    </div>
  </div>
</section>

<section id="multimedia" class="section">
  <div class="container">
    <h2 style="text-align:center; margin-bottom:50px;">MULTIMEDIA EXPLORATIONS</h2>
    <div class="video-wrapper">
      <div class="video-box"><iframe src="https://www.youtube.com/embed/eeK4zygWBBI"></iframe></div>
      <div class="video-box" style="margin-top:40px;"><iframe src="https://www.youtube.com/embed/k5hRo8oxdBM"></iframe></div>
    </div>
  </div>
</section>

<div class="lightbox" id="lightbox">
  <div style="background:#111; padding:40px; max-width:800px; width:100%; position:relative;">
    <button onclick="closeLightbox()" style="position:absolute; right:20px; top:20px; cursor:pointer;">Close</button>
    <img id="lightbox-img" src="" style="width:100%; height:auto;">
    <h3 id="lightbox-title"></h3>
  </div>
</div>

<script>
  function openLightbox(img, detail, title) {
    document.getElementById('lightbox-img').src = img;
    document.getElementById('lightbox-title').innerText = title;
    document.getElementById('lightbox').classList.add('active');
  }
  function closeLightbox() { document.getElementById('lightbox').classList.remove('active'); }
</script>

</body>
</html>
