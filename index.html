<style>

:root{
--black:#080808;
--dark:#111116;
--gray:#202027;
--gold:#c5a059;
--white:#f1eee8;
}


*{
box-sizing:border-box;
}


body{

margin:0;
background:
radial-gradient(circle at top,#1b1b22 0%,#080808 55%);
color:var(--white);
font-family:'Plus Jakarta Sans',sans-serif;
line-height:1.7;

}


h1,h2,h3{

font-family:'Cinzel',serif;
letter-spacing:2px;

}


a{

color:var(--gold);
text-decoration:none;

}


header{

position:relative;
padding:30px 20px;
background:#0a0a0c;
border-bottom:1px solid #292929;

}


.nav{

max-width:1200px;
margin:auto;
display:flex;
justify-content:space-between;
align-items:center;
flex-wrap:wrap;

}


.logo{

font-size:28px;
color:var(--white);

}


.menu a{

margin:10px;
font-size:14px;

}



.hero{

min-height:85vh;
display:flex;
align-items:center;
justify-content:center;
text-align:center;
padding:40px 20px;

}


.hero-content{

max-width:850px;

}


.hero h1{

font-size:clamp(42px,7vw,80px);
margin-bottom:10px;

}


.hero p{

font-size:20px;
color:#cfcfcf;

}


.button{

display:inline-block;
margin-top:30px;
padding:15px 35px;
border:1px solid var(--gold);
transition:.3s;

}


.button:hover{

background:var(--gold);
color:#000;

}



section{

max-width:1200px;
margin:auto;
padding:70px 25px;

}


.section-title{

text-align:center;
margin-bottom:40px;

}


.gallery{

display:grid;
grid-template-columns:repeat(auto-fit,minmax(280px,1fr));
gap:30px;

}


.card{

background:#111;
border:1px solid #292929;
padding:20px;
transition:.4s;

}


.card:hover{

transform:translateY(-8px);
border-color:var(--gold);

}


.card img{

width:100%;
height:350px;
object-fit:cover;

}


.card h3{

color:var(--gold);

}
